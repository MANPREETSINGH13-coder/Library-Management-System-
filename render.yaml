services:
  - type: web
    name: bbau-library-api
    runtime: docker
    repo: https://github.com/MANPREETSINGH13-coder/Library-Management-System-
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/books
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: bbau_library
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false

  - type: web
    name: bbau-library-web
    runtime: static
    repo: https://github.com/MANPREETSINGH13-coder/Library-Management-System-
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: bbau-library-api
          envVarKey: RENDER_EXTERNAL_URL