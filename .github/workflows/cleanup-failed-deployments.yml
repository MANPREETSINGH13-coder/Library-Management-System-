name: Cleanup failed deployments

on:
  workflow_dispatch:

permissions:
  deployments: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete failed GitHub Pages deployments
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              { owner, repo, environment: 'github-pages', per_page: 100 }
            );
            for (const deployment of deployments) {
              const statuses = await github.rest.repos.listDeploymentStatuses({
                owner,
                repo,
                deployment_id: deployment.id,
                per_page: 1
              });
              const state = statuses.data[0]?.state;
              if (state === 'failure' || state === 'error') {
                await github.rest.repos.deleteDeployment({ owner, repo, deployment_id: deployment.id });
                core.info(`Deleted failed deployment ${deployment.id}`);
              }
            }
